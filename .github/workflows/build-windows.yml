# Repository policy allows local actions only, so this workflow deliberately
# contains no "uses:" step: nothing from the marketplace is allowed to run here.
# Everything is done with the tools the windows-2022 image already ships - git,
# CMake, Ninja and the MSVC build tools - and with the repository's own entry
# point, build_win.ps1, which applies the pinned NVRHI patch, compiles the
# shaders and deploys the runtime assets.
#
# The image does not ship the Vulkan SDK, and the project needs it for two
# reasons: NVRHI refuses headers older than VK_HEADER_VERSION 318 and needs
# vulkan.hpp, and build_shaders.ps1 needs a dxc that was built with
# -DENABLE_SPIRV_CODEGEN=ON. The dxc that ships in the Windows SDK is not that
# dxc - it fails with "SPIR-V CodeGen not available" - so the step below
# installs the SDK, pinned to the version the project is developed against. If
# the vendor installer refuses to cooperate in a headless session, the step
# assembles the same three pieces - headers, vulkan-1.lib, dxc - from their
# upstream releases instead of skipping the dependency.
#
# Tests: the GPU tests are labelled "gpu" and are skipped here. A hosted runner
# has no Vulkan device, and those tests fail hard rather than skipping when
# device creation fails, so running them would report a failure that says
# nothing about the change. Run "ctest -L gpu" locally for that coverage.
name: Windows CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    env:
      QR_CONFIG: ${{ matrix.configuration }}

    steps:
      - name: Check out the sources
        shell: pwsh
        env:
          # refs/heads/<branch> for a push, refs/pull/<n>/merge for a pull
          # request - in both cases exactly the commit that has to be built.
          QR_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Continue'
          git init -q .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth 1 origin $env:QR_REF
          if ($LASTEXITCODE -ne 0) { throw "fetch of $env:QR_REF failed" }
          git checkout --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "checkout of FETCH_HEAD failed" }
          git submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw "submodule checkout failed" }
          git log -1 --format='building %H %s'

      - name: Install the Vulkan SDK
        shell: pwsh
        env:
          QR_VULKAN_SDK_VERSION: 1.4.321.1
          QR_DXC_VERSION: v1.9.2609
          QR_DXC_ASSET: dxc_2026_09_29.zip
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:QR_VULKAN_SDK_VERSION

          # The three things the build actually consumes from an SDK.
          function Test-Sdk([string] $root) {
            if (-not (Test-Path (Join-Path $root 'Bin\dxc.exe'))) { return $false }
            if (-not (Test-Path (Join-Path $root 'Lib\vulkan-1.lib'))) { return $false }
            $core = Join-Path $root 'Include\vulkan\vulkan_core.h'
            if (-not (Test-Path $core)) { return $false }
            if (-not (Test-Path (Join-Path $root 'Include\vulkan\vulkan.hpp'))) { return $false }
            # NVRHI refuses anything below 1.4.318 (see third_party/nvrhi).
            $match = Select-String -Path $core -Pattern 'define VK_HEADER_VERSION (\d+)' | Select-Object -First 1
            return [int] $match.Matches.Groups[1].Value -ge 318
          }

          # A future image may start shipping the SDK; prefer it over a download.
          $sdk = Get-ChildItem "${env:ProgramFiles}\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          if ($sdk -and (Test-Sdk $sdk)) {
            Write-Host "using the preinstalled SDK at $sdk"
          } else {
            # The hosted image does not ship a usable Vulkan SDK. The NSIS
            # installer can hang in a headless session (it spawns a child
            # process tree that Start-Process -Wait keeps waiting on), so
            # assemble the three pieces the build consumes directly from their
            # upstream releases: headers, the checked-in import library, and a
            # dxc with SPIR-V code generation.
            Write-Host "the image has no usable Vulkan SDK, assembling one from upstream releases"
            $sdk = Join-Path $env:RUNNER_TEMP 'vulkan-sdk-minimal'

            $headerTag = 'vulkan-sdk-' + (($version -split '\.')[0..2] -join '.') + '.0'
            $headersZip = Join-Path $env:RUNNER_TEMP 'vulkan-headers.zip'
            $headersUrl = "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/$headerTag.zip"
            curl.exe --location --fail --silent --show-error --retry 3 --max-time 600 --output $headersZip $headersUrl
            if ($LASTEXITCODE -ne 0) { throw "download of $headersUrl failed with $LASTEXITCODE" }
            Expand-Archive -Path $headersZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'vulkan-headers') -Force
            $headersRoot = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'vulkan-headers') -Directory |
              Select-Object -First 1 -ExpandProperty FullName

            New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'Include') | Out-Null
            Copy-Item (Join-Path $headersRoot 'include\*') (Join-Path $sdk 'Include') -Recurse -Force
            New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'Lib') | Out-Null
            Copy-Item 'Windows\misc\x64\vulkan-1.lib' (Join-Path $sdk 'Lib') -Force

            # The CPU tests that are linked against the Vulkan backend import
            # vulkan-1.dll even though they never create a device. The hosted
            # image has no system loader, so supply one in the minimal SDK's
            # Bin directory (which is on PATH for the test step).
            $loaderZip = Join-Path $env:RUNNER_TEMP 'vulkan-loader.nupkg'
            $loaderUrl = 'https://api.nuget.org/v3-flatcontainer/silk.net.vulkan.loader.native/2025.9.12/silk.net.vulkan.loader.native.2025.9.12.nupkg'
            curl.exe --location --fail --silent --show-error --retry 3 --max-time 300 --output $loaderZip $loaderUrl
            if ($LASTEXITCODE -ne 0) { throw "download of $loaderUrl failed with $LASTEXITCODE" }
            Expand-Archive -Path $loaderZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'vulkan-loader') -Force
            New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'Bin') | Out-Null
            Copy-Item (Join-Path $env:RUNNER_TEMP 'vulkan-loader\runtimes\win-x64\native\vulkan-1.dll') (Join-Path $sdk 'Bin') -Force

            $dxcZip = Join-Path $env:RUNNER_TEMP 'dxc.zip'
            $dxcUrl = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$env:QR_DXC_VERSION/$env:QR_DXC_ASSET"
            curl.exe --location --fail --silent --show-error --retry 3 --max-time 600 --output $dxcZip $dxcUrl
            if ($LASTEXITCODE -ne 0) { throw "download of $dxcUrl failed with $LASTEXITCODE" }
            Expand-Archive -Path $dxcZip -DestinationPath (Join-Path $env:RUNNER_TEMP 'dxc') -Force
            New-Item -ItemType Directory -Force -Path (Join-Path $sdk 'Bin') | Out-Null
            Copy-Item (Join-Path $env:RUNNER_TEMP 'dxc\bin\x64\*') (Join-Path $sdk 'Bin') -Force
          }

          # Fail here rather than inside the build if the install did not land.
          foreach ($required in 'Bin\dxc.exe', 'Include\vulkan\vulkan.hpp', 'Lib\vulkan-1.lib') {
            if (-not (Test-Path (Join-Path $sdk $required))) {
              throw "$required is missing from $sdk"
            }
          }
          Get-Content (Join-Path $sdk 'InstallationLog.txt') -ErrorAction SilentlyContinue |
            Select-String -Pattern 'Version' | Select-Object -First 1

          "VULKAN_SDK=$sdk" | Add-Content $env:GITHUB_ENV
          (Join-Path $sdk 'Bin') | Add-Content $env:GITHUB_PATH

      - name: Check the toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VULKAN_SDK) {
            throw "VULKAN_SDK is not set. build_shaders.ps1 needs the Vulkan SDK for dxc."
          }
          $dxc = Join-Path $env:VULKAN_SDK 'Bin\dxc.exe'
          if (-not (Test-Path $dxc)) { throw "$dxc is missing" }

          # The reason this step exists: a dxc that reports --version happily
          # still cannot emit SPIR-V, and the build would fail much later.
          $probe = Join-Path $env:RUNNER_TEMP 'spirv-probe.hlsl'
          Set-Content -Path $probe -Value '[numthreads(1, 1, 1)] void main() { }'
          $out = Join-Path $env:RUNNER_TEMP 'spirv-probe.spv'
          & $dxc -spirv -T cs_6_6 -E main $probe -Fo $out
          if ($LASTEXITCODE -ne 0) { throw "$dxc cannot emit SPIR-V (exit $LASTEXITCODE)" }
          if (-not (Test-Path $out)) { throw "$dxc produced no SPIR-V" }

          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          Write-Host "dxc        = $dxc"
          Write-Host "cmake      = $((Get-Command cmake).Source)"
          Write-Host "ninja      = $((Get-Command ninja).Source)"

      - name: Build
        shell: pwsh
        run: |
          & .\build_win.ps1 $env:QR_CONFIG -Tests
          if ($LASTEXITCODE -ne 0) { throw "build_win.ps1 exited with $LASTEXITCODE" }

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir "build\$env:QR_CONFIG" --output-on-failure -LE gpu
          if ($LASTEXITCODE -ne 0) { throw "ctest exited with $LASTEXITCODE" }

      - name: Show the build receipt
        shell: pwsh
        run: Get-Content "build\$env:QR_CONFIG\qray-build.json"

      - name: Upload the manual Windows build
        if: github.event_name == 'workflow_dispatch' && matrix.configuration == 'Release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "ci-windows-$env:GITHUB_RUN_ID"
          $zip = Join-Path $env:RUNNER_TEMP "quakeray-windows-$env:QR_CONFIG.zip"
          $paths = @()
          $paths += (Get-ChildItem "build\$env:QR_CONFIG" -File -Filter *.dll | Select-Object -ExpandProperty FullName)
          $paths += (Resolve-Path "build\$env:QR_CONFIG\quakeray.exe").Path
          $paths += (Resolve-Path "build\$env:QR_CONFIG\id1").Path
          Compress-Archive -Path $paths -DestinationPath $zip -Force
          gh release create $tag $zip --repo $env:GITHUB_REPOSITORY --title "Windows build $env:GITHUB_RUN_ID" --notes "Manual Windows build for Proton testing." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE" }
          Write-Host "Release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
