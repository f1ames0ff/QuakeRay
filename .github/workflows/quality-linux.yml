# Linux regression protection gate for QuakeRay.
# Repository policy allows local actions only (no third-party `uses:` steps).
name: Quality Linux

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_HEADERS_TAG: vulkan-sdk-1.4.328.0
  QR_DXC_VERSION: v1.9.2609
  QR_DXC_ASSET: linux_dxc_2026_09_28.x86_x64.tar.gz
  SONAR_CLI_VERSION: 8.4.0.16527

jobs:
  quality:
    name: ASan/UBSan + Static Analysis + Tests + Sonar
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository and submodules with full history
        shell: bash
        env:
          QR_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$QR_REF"
          git checkout --force FETCH_HEAD
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
          else
            git fetch --no-tags origin master
          fi
          git fetch --no-tags --depth=50 origin HEAD
          git submodule update --init --recursive --depth 1
          git log -1 --oneline

      - name: Install build, test, and static analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-tidy cppcheck \
            glslang-tools libvulkan-dev libsdl2-dev libopenal-dev libx11-dev \
            python3 python3-pip curl unzip tar ca-certificates
          python3 -m pip install --break-system-packages --only-binary :all: \
            ruff==0.17.6 lizard==1.26.1 pygments==2.21.0 pathspec==1.1.1 uv==0.13.9

      - name: Install pinned Vulkan headers and Linux DXC
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/qray-deps"
          mkdir -p "$deps/vulkan-headers" "$deps/dxc"

          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error --retry 3 \
            "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/${VULKAN_HEADERS_TAG}.tar.gz" \
            -o "$deps/vk.tar.gz"
          tar -xzf "$deps/vk.tar.gz" --strip-components=1 -C "$deps/vulkan-headers"

          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error --retry 3 \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${QR_DXC_VERSION}/${QR_DXC_ASSET}" \
            -o "$deps/dxc.tar.gz"
          tar -xzf "$deps/dxc.tar.gz" -C "$deps/dxc"

          dxc_bin="$deps/dxc/bin/dxc"
          test -x "$dxc_bin"
          printf '[numthreads(1,1,1)]\nvoid main() {}\n' > "$RUNNER_TEMP/probe.hlsl"
          "$dxc_bin" -spirv -fspv-target-env=vulkan1.2 -T cs_6_2 -E main "$RUNNER_TEMP/probe.hlsl" -Fo "$RUNNER_TEMP/probe.spv"
          test -s "$RUNNER_TEMP/probe.spv"

          echo "VULKAN_HEADERS_DIR=$deps/vulkan-headers/include" >> "$GITHUB_ENV"
          echo "QR_DXC=$dxc_bin" >> "$GITHUB_ENV"
          echo "$deps/dxc/bin" >> "$GITHUB_PATH"

      - name: Build QuakeRay (Clang + ASan/UBSan + compile_commands)
        shell: bash
        run: |
          set -euo pipefail
          CC=clang CXX=clang++ \
          QR_BUILD_DIR="$PWD/build/quality" \
          GLSLANG_VALIDATOR="$(command -v glslangValidator)" \
          VULKAN_HEADERS_DIR="$VULKAN_HEADERS_DIR" \
          QR_DXC="$QR_DXC" \
          QR_BUILD_TESTS=1 \
          QR_BUILD_AUDIO_TESTS=1 \
          QR_SKIP_ASSETS=1 \
          QR_RUN_TESTS=0 \
          ./build_linux.sh \
            -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DQR_ENABLE_SANITIZERS=ON \
            -DUSE_CODEC_MP3=OFF \
            -DUSE_CODEC_VORBIS=OFF \
            -DUSE_CODEC_FLAC=OFF \
            -DUSE_CODEC_OPUS=OFF \
            -DUSE_CODEC_XMP=OFF \
            -DUSE_CODEC_MIKMOD=OFF

      - name: Run C/C++ CPU, audio, and contract tests under ASan + UBSan
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build/quality --output-on-failure -LE gpu

      - name: Run Python unit tests (quality, perf runners, MCP server)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools -p "test_*.py" -v
          python3 -B -m unittest discover -s tests/perf -p "test_*.py" -v
          uv sync --locked --no-build --no-install-project --project tools/quakeray_mcp --python 3.10
          PYTHONPATH=tools/quakeray_mcp/src uv run --no-build --no-sync --offline --frozen --python 3.10 --project tools/quakeray_mcp python -B -m unittest discover -s tools/quakeray_mcp/tests -p "test_*.py" -q

      - name: Verify HLSL matrix reads and compile all shaders
        shell: bash
        run: |
          set -euo pipefail
          cd renderer/Source/Shaders
          python3 -B CheckMatrixReads.py
          log="$(python3 -B GenerateShaders.py -rebuild)"
          printf '%s\n' "$log"
          if printf '%s\n' "$log" | grep -qE 'shader builds? failed'; then
            echo "::error::GenerateShaders.py reported shader compilation failure"
            exit 1
          fi

      - name: Run diff-gated static analysis and complexity checks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            diff_base="origin/${BASE_REF}"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            diff_base="$BEFORE_SHA"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            diff_base="$(git rev-parse HEAD~1)"
          else
            diff_base="$(git rev-parse HEAD)"
          fi
          python3 -B tools/check_quality.py \
            --base "$diff_base" \
            --compile-commands build/quality/compile_commands.json \
            --strict-tools

      - name: Run SonarQube Cloud analysis
        shell: bash
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_REGION: ${{ vars.SONAR_REGION }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sonar_org="${SONAR_ORGANIZATION:-f1ames0ff}"
          sonar_proj="${SONAR_PROJECT_KEY:-f1ames0ff_QuakeRay}"

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::notice::GitHub OIDC token unavailable (e.g. fork PR); skipping SonarQube Cloud scan."
            exit 0
          fi

          oidc_json="$RUNNER_TEMP/sonar_oidc.json"
          python3 -B - "$oidc_json" "$sonar_proj" <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          REGIONS = {
              "eu": ("https://api.sonarcloud.io", "https://sonarcloud.io"),
              "us": ("https://api.sonarqube.us", "https://sonarqube.us"),
              "au": ("https://api.sonarqube.au", "https://sonarqube.au"),
          }

          def write_json(path: str, payload: dict) -> None:
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as fh:
                  json.dump(payload, fh)

          def get_github_oidc_jwt(req_url: str, req_token: str, audience: str) -> str:
              parsed = urllib.parse.urlparse(req_url)
              if parsed.scheme != "https" or not parsed.netloc:
                  raise RuntimeError("Invalid ACTIONS_ID_TOKEN_REQUEST_URL scheme")
              query = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
              query.append(("audience", audience))
              full_url = urllib.parse.urlunparse(parsed._replace(query=urllib.parse.urlencode(query)))
              req = urllib.request.Request(
                  full_url,
                  headers={
                      "Authorization": f"Bearer {req_token}",
                      "Accept": "application/json; api-version=2.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
              token = data.get("value")
              if not token:
                  raise RuntimeError("GitHub OIDC response did not contain a token value")
              return token

          def exchange_oidc_token(api_url: str, audience: str, subject_token: str, project_key: str) -> dict:
              endpoint = f"{api_url}/authentication/token"
              form = {
                  "grant_type": "urn:ietf:params:oauth:grant-type:token-exchange",
                  "subject_token": subject_token,
                  "subject_token_type": "urn:ietf:params:oauth:token-type:id_token",
                  "audience": audience,
              }
              if project_key:
                  form["project_key"] = project_key
              body_bytes = urllib.parse.urlencode(form).encode("utf-8")
              req = urllib.request.Request(
                  endpoint,
                  data=body_bytes,
                  method="POST",
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as err:
                      raw = err.read().decode("utf-8", errors="replace")
                      try:
                          parsed = json.loads(raw)
                      except json.JSONDecodeError:
                          parsed = {}
                      detail = parsed.get("error_description") or parsed.get("error") or f"HTTP {err.code}"
                      if err.code in (403, 404):
                          print(
                              f"::warning::SonarQube Cloud OIDC exchange returned HTTP {err.code} ({detail}). "
                              "Enable 'Secretless analysis for GitHub Actions' in SonarQube Cloud Organization -> "
                              "Administration -> Analysis method; skipping CLI scan."
                          )
                          return {"_skip": True}
                      if err.code >= 500 and attempt < 3:
                          time.sleep(attempt)
                          continue
                      raise RuntimeError(f"SonarQube Cloud OIDC exchange failed with HTTP {err.code}: {detail}") from err
                  except urllib.error.URLError as err:
                      if attempt < 3:
                          time.sleep(attempt)
                          continue
                      raise RuntimeError(f"SonarQube Cloud OIDC exchange failed: {err}") from err
              raise RuntimeError("SonarQube Cloud OIDC exchange exhausted retries")

          out_path, default_proj = sys.argv[1], sys.argv[2]
          region = (os.environ.get("SONAR_REGION") or "eu").strip().lower() or "eu"
          if region not in REGIONS:
              raise RuntimeError(f"Unsupported SONAR_REGION: {region!r}")
          api_url, audience = REGIONS[region]
          jwt_token = get_github_oidc_jwt(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"],
              os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
              audience,
          )
          exchanged = exchange_oidc_token(api_url, audience, jwt_token, default_proj)
          if exchanged.get("_skip"):
              write_json(out_path, {"skip": True})
              raise SystemExit(0)
          access_token = exchanged.get("access_token")
          if not access_token:
              raise RuntimeError("SonarQube Cloud OIDC exchange succeeded but returned no access_token")
          print(f"::add-mask::{access_token}", flush=True)
          write_json(
              out_path,
              {
                  "skip": False,
                  "token": access_token,
                  "org": exchanged.get("organization") or "",
                  "proj": exchanged.get("project_key") or "",
              },
          )
          PY

          if [ "$(python3 -B -c 'import json,sys; print(1 if json.load(open(sys.argv[1])).get("skip") else 0)' "$oidc_json")" = "1" ]; then
            rm -f "$oidc_json"
            exit 0
          fi
          SONAR_TOKEN="$(python3 -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"], end="")' "$oidc_json")"
          export SONAR_TOKEN
          resolved_org="$(python3 -B -c 'import json,sys; print(json.load(open(sys.argv[1])).get("org",""), end="")' "$oidc_json")"
          resolved_proj="$(python3 -B -c 'import json,sys; print(json.load(open(sys.argv[1])).get("proj",""), end="")' "$oidc_json")"
          rm -f "$oidc_json"
          sonar_org="${resolved_org:-$sonar_org}"
          sonar_proj="${resolved_proj:-$sonar_proj}"

          cli_dir="$RUNNER_TEMP/sonar-scanner"
          mkdir -p "$cli_dir"
          curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error --retry 3 \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_CLI_VERSION}-linux-x64.zip" \
            -o "$cli_dir/sonar.zip"
          unzip -q "$cli_dir/sonar.zip" -d "$cli_dir"
          scanner="$(find "$cli_dir" -maxdepth 3 -type f -name sonar-scanner | head -n 1)"

          sonar_args=(
            "-Dsonar.organization=${sonar_org}"
            "-Dsonar.projectKey=${sonar_proj}"
            "-Dsonar.qualitygate.wait=true"
          )
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sonar_args+=(
              "-Dsonar.pullrequest.key=${PR_NUMBER}"
              "-Dsonar.pullrequest.branch=${HEAD_REF}"
              "-Dsonar.pullrequest.base=${BASE_REF}"
            )
          else
            sonar_args+=("-Dsonar.branch.name=${REF_NAME}")
          fi

          set +e
          out="$("$scanner" "${sonar_args[@]}" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            if printf '%s\n' "$out" | grep -qi "Automatic Analysis is enabled"; then
              echo "::warning::SonarQube Cloud Automatic Analysis is still enabled on this project; disable Automatic Analysis in Project Administration -> Analysis Method so CI Secretless analysis with compile_commands.json runs."
              exit 0
            fi
            exit "$rc"
          fi
